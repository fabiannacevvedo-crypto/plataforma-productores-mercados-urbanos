<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · Productores & Mercados Urbanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body class="bg-verde-oscuro">
    <main class="d-flex align-items-center justify-content-center flex-column py-5">
      <div class="text-center text-white mb-4">
        <h1 class="fw-bold mb-1"><i class="bi bi-basket-fill"></i> Productores & Mercados Urbanos</h1>
        <p class="mb-0 text-white-50">Conectá el campo de Formosa y el NEA con las ciudades</p>
      </div>

      <div class="card shadow-lg border-0 login-card">
        <div class="card-body p-4">
          <h2 class="h5 text-center text-verde fw-bold mb-4">Iniciar sesión</h2>

          <div id="area-alerta"></div>

          <form id="form-login">
            <div class="mb-3">
              <label class="form-label small fw-semibold" for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required />
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold" for="password">Contraseña</label>
              <input type="password" class="form-control" id="password" placeholder="••••••" required />
            </div>
            <button type="submit" id="boton-ingresar" class="btn btn-naranja w-100 fw-semibold">
              Ingresar
            </button>
          </form>

          <hr class="my-4" />
          <p class="text-center small text-body-secondary mb-0">
            ¿Sin cuenta? <a href="/registro.html" class="text-verde fw-semibold">Registrate como productor o comprador</a>
          </p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/login.js"></script>
  </body>
</html>
