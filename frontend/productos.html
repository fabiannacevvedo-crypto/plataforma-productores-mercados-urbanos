<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos · Productores & Mercados Urbanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-verde shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/inicio.html"><i class="bi bi-basket-fill text-naranja"></i> Productores & Mercados</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="link-nav" data-pagina="inicio" href="/inicio.html">Inicio</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="productos" href="/productos.html">Productos</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="productores" href="/productores.html">Productores</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="compradores" href="/compradores.html">Compradores</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="transacciones" href="/transacciones.html">Transacciones</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="chats" href="/chats.html">Chats</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <div class="text-end me-2 d-none d-md-block">
              <div class="fw-semibold text-white" id="usuario-nombre" style="font-size: 0.9rem;"></div>
              <div class="text-white-50 text-capitalize" id="usuario-rol" style="font-size: 0.75rem;"></div>
            </div>
            <button class="btn btn-naranja btn-sm" id="boton-cerrar-sesion">Salir</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0">Productos del campo</h1>
          <p class="text-body-secondary small mb-0">
            <span data-texto-rol></span>
          </p>
        </div>
        <button class="btn btn-success d-none" id="boton-nuevo-producto" data-bs-toggle="modal" data-bs-target="#modal-producto">
          <i class="bi bi-plus-lg"></i> Publicar producto
        </button>
      </div>

      <div id="area-alerta"></div>
      <div id="area-productos"></div>
    </main>

    <div class="modal fade" id="modal-producto" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-producto">Publicar producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-producto"></div>
            <form id="form-producto">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Nombre</label>
                <input type="text" class="form-control" id="p-nombre" required />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Descripción</label>
                <textarea class="form-control" id="p-descripcion" rows="3" required></textarea>
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label small fw-semibold">Precio ($)</label>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="p-precio" required />
                </div>
                <div class="col-6">
                  <label class="form-label small fw-semibold">Stock</label>
                  <input type="number" min="0" class="form-control" id="p-stock" required />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-producto" class="btn btn-success" id="boton-guardar-producto">Publicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-pedido" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-pedido">Nuevo pedido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-body-secondary mb-3" id="info-pedido"></p>
            <div id="alerta-pedido"></div>
            <form id="form-pedido">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Cantidad</label>
                <input type="number" min="1" class="form-control" id="ped-cantidad" required />
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Precio negociado ($)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="ped-precio" required />
              </div>
              <div class="form-text">
                Para confirmarse, este precio debe coincidir con una oferta enviada en el chat.
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-pedido" class="btn btn-naranja">Crear pedido</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-confirmar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirmar eliminación</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="mb-0 text-body-secondary" id="texto-confirmar"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="boton-eliminar-confirmado">Sí, eliminar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/productos.js"></script>
  </body>
</html>
