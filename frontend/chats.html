<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats · Productores & Mercados Urbanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-verde shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/inicio.html"><i class="bi bi-basket-fill text-naranja"></i> Productores & Mercados</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="link-nav" data-pagina="inicio" href="/inicio.html">Inicio</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="productos" href="/productos.html">Productos</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="productores" href="/productores.html">Productores</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="compradores" href="/compradores.html">Compradores</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="transacciones" href="/transacciones.html">Transacciones</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="chats" href="/chats.html">Chats</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <div class="text-end me-2 d-none d-md-block">
              <div class="fw-semibold text-white" id="usuario-nombre" style="font-size: 0.9rem;"></div>
              <div class="text-white-50 text-capitalize" id="usuario-rol" style="font-size: 0.75rem;"></div>
            </div>
            <button class="btn btn-naranja btn-sm" id="boton-cerrar-sesion">Salir</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold text-verde mb-0">Negociación en vivo</h1>
        <a class="btn btn-outline-success btn-sm" href="/productores.html" id="enlace-nuevo">
          <i class="bi bi-person-plus"></i> Buscar contacto
        </a>
      </div>

      <div id="area-alerta"></div>

      <div class="card shadow-sm">
        <div class="row g-0">
          <div class="col-md-4 col-lg-3 border-end">
            <div class="p-3 border-bottom">
              <div class="fw-semibold small text-verde">Conversaciones</div>
            </div>
            <div class="lista-contactos" id="area-contactos"></div>
          </div>
          <div class="col-md-8 col-lg-9">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center" id="cabecera-chat">
              <div>
                <div class="fw-semibold" id="chat-titulo">Seleccioná un contacto</div>
                <div class="text-body-secondary small" id="chat-subtitulo"></div>
              </div>
            </div>
            <div class="panel-chat p-3" id="area-mensajes"></div>
            <form class="p-3 border-top bg-white" id="form-mensaje">
              <div class="row g-2">
                <div class="col-12 col-md-3">
                  <input type="number" step="0.01" min="0.01" class="form-control" id="precio-oferta" placeholder="Precio oferta ($)" />
                </div>
                <div class="col-12 col-md-7">
                  <input type="text" class="form-control" id="texto-mensaje" placeholder="Escribí un mensaje de negociación..." autocomplete="off" />
                </div>
                <div class="col-12 col-md-2">
                  <button type="submit" class="btn btn-naranja w-100" id="boton-enviar">
                    <i class="bi bi-send"></i>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/chats.js"></script>
  </body>
</html>
