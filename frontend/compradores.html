<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compradores · Productores & Mercados Urbanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-verde shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/inicio.html"><i class="bi bi-basket-fill text-naranja"></i> Productores & Mercados</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="link-nav" data-pagina="inicio" href="/inicio.html">Inicio</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="productos" href="/productos.html">Productos</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="productores" href="/productores.html">Productores</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="compradores" href="/compradores.html">Compradores</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="transacciones" href="/transacciones.html">Transacciones</a></li>
            <li class="nav-item"><a class="link-nav" data-pagina="chats" href="/chats.html">Chats</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <div class="text-end me-2 d-none d-md-block">
              <div class="fw-semibold text-white" id="usuario-nombre" style="font-size: 0.9rem;"></div>
              <div class="text-white-50 text-capitalize" id="usuario-rol" style="font-size: 0.75rem;"></div>
            </div>
            <button class="btn btn-naranja btn-sm" id="boton-cerrar-sesion">Salir</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0">Compradores</h1>
          <p class="text-body-secondary small mb-0">Comercios, restaurantes y mayoristas</p>
        </div>
        <button class="btn btn-outline-success d-none" id="boton-mi-perfil" data-bs-toggle="modal" data-bs-target="#modal-perfil">
          <i class="bi bi-person-gear"></i> Mi perfil
        </button>
      </div>

      <div id="area-alerta"></div>
      <div id="area-compradores"></div>
    </main>

    <div class="modal fade" id="modal-perfil" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Mi perfil de comprador</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-perfil"></div>
            <form id="form-perfil">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Nombre</label>
                <input type="text" class="form-control" id="per-nombre" required />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Ubicación</label>
                <input type="text" class="form-control" id="per-ubicacion" required />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Tipo</label>
                <select class="form-select" id="per-tipo">
                  <option value="comercio">Comercio</option>
                  <option value="restaurante">Restaurante</option>
                  <option value="mayorista">Mayorista</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-perfil" class="btn btn-success">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-vinculados" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Productores con los que opero</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="cuerpo-vinculados"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/compradores.js"></script>
  </body>
</html>
