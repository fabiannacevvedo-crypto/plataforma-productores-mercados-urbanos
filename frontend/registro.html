<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro · Productores & Mercados Urbanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body class="bg-verde-oscuro">
    <main class="d-flex align-items-center justify-content-center flex-column py-5 px-3">
      <div class="card shadow-lg border-0 login-card">
        <div class="card-body p-4">
          <h2 class="h5 text-center text-verde fw-bold">Crear cuenta</h2>
          <p class="text-center small text-body-secondary mb-3">Unite a la plataforma</p>

          <div class="btn-group w-100 mb-4" role="group">
            <input type="radio" class="btn-check" name="rol" id="rol-productor" value="productor" checked />
            <label class="btn btn-outline-success" for="rol-productor">Productor</label>
            <input type="radio" class="btn-check" name="rol" id="rol-comprador" value="comprador" />
            <label class="btn btn-outline-success" for="rol-comprador">Comprador</label>
          </div>

          <div id="area-alerta"></div>

          <form id="form-registro">
            <div class="mb-3">
              <label class="form-label small fw-semibold" for="nombre">Nombre</label>
              <input type="text" class="form-control" id="nombre" required />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="email">Email</label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="password">Contraseña</label>
              <input type="password" class="form-control" id="password" minlength="6" required />
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="ubicacion">Ubicación</label>
              <input type="text" class="form-control" id="ubicacion" placeholder="Ej: Formosa Capital, Clorinda..." required />
            </div>

            <div class="mb-3 d-none" id="campo-tipo-productos">
              <label class="form-label small fw-semibold" for="tipo_productos">Tipo de productos</label>
              <input type="text" class="form-control" id="tipo_productos" placeholder="Ej: Hortalizas, frutas, lácteos" />
            </div>

            <div class="mb-3 d-none" id="campo-suscripcion">
              <label class="form-label small fw-semibold" for="suscripcion">Suscripción</label>
              <select class="form-select" id="suscripcion">
                <option value="estandar">Estándar</option>
                <option value="premium">Premium</option>
              </select>
            </div>

            <div class="mb-4 d-none" id="campo-tipo">
              <label class="form-label small fw-semibold" for="tipo">Tipo de comprador</label>
              <select class="form-select" id="tipo">
                <option value="comercio">Comercio</option>
                <option value="restaurante">Restaurante</option>
                <option value="mayorista">Mayorista</option>
              </select>
            </div>

            <button type="submit" id="boton-registrar" class="btn btn-success w-100 fw-semibold">Registrarse</button>
          </form>

          <hr class="my-4" />
          <p class="text-center small text-body-secondary mb-0">
            ¿Ya tenés cuenta? <a href="/index.html" class="text-verde fw-semibold">Iniciar sesión</a>
          </p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/registro.js"></script>
  </body>
</html>
